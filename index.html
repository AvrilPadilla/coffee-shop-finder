<!DOCTYPE html>
<html lang="en">

<head>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:wght@600&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <script>
    try {
      // Make sure the browser can actually save things before we rely on it
      localStorage.setItem("crunchTest", "1");
      localStorage.removeItem("crunchTest");

      if (localStorage.getItem("crunchSeenWelcome") !== "yes") {
        location.replace("welcome.html");
      }
    } catch (error) {
      // Storage is blocked (some private modes): skip the intro instead of looping
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Shop Finder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- The top of the page -->
  <header>
    <h1>Coffee Shop Finder</h1>
    <p>Find a cafe with the wifi, outlets, noise level, and seating you need to get work done.</p>
  </header>

  <main>
    <!-- Week 3: filters will go here -->
    <section id="filters">
      <h2>Filters</h2>

      <label class="check">
        <input type="checkbox" id="filter-wifi"> Wi-Fi required
      </label>

      <label>Outlets
        <select id="filter-outlets">
          <option value="any">Any</option>
          <option value="limited">Limited</option>
          <option value="some">Some</option>
          <option value="plenty">Plenty</option>
        </select>
      </label>

      <label>Noise
        <select id="filter-noise">
          <option value="any">Any</option>
          <option value="quiet">Quiet</option>
          <option value="moderate">Moderate</option>
          <option value="loud">Loud</option>
        </select>
      </label>

      <label>Seating
        <select id="filter-seating">
          <option value="any">Any</option>
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
        </select>
      </label>
    </section>

    <!-- Week 2: JavaScript will fill this with a card for each shop -->
    <section id="shop-list">
      <h2>Shops</h2>
      <div id="shop-cards"></div>
    </section>
  </main>

  <footer>
    <p>Built by Avril Padilla at Saddleback College</p>
  </footer>

  <!-- Week 2: our JavaScript file will be linked here -->
  <script src="script.js"></script>
</body>

</html>
