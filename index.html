<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>crunch. | Home</title>

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <script
      src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"
      defer
    ></script>
  </head>

  <body class="home-page">
    <header class="home-header">
      <div class="home-header-inner">
        <span class="home-header-spacer"></span>

        <a href="index.html" class="home-logo">crunch.</a>

        <nav class="home-desktop-nav" aria-label="Desktop navigation">
          <a href="index.html">Home</a>
          <a href="explore.html">Explore</a>
          <a href="saved.html">Saved</a>
        </nav>

        <a
          href="account.html"
          class="home-profile"
          aria-label="Student account"
        >
          <i data-lucide="circle-user-round"></i>
        </a>
      </div>
    </header>

    <main class="home-main">
      <!-- Search -->
      <div class="home-search-row">
        <label class="home-search-box">
          <span aria-hidden="true">⌕</span>
          <input
            type="search"
            id="home-search"
            placeholder="Search for cafés, food, events..."
            aria-label="Search places"
          />
        </label>

        <a
          href="explore.html"
          class="home-filter-button"
          aria-label="Open Explore filters"
        >
          ☷
        </a>
      </div>

      <!-- Distance -->
      <section class="home-distance">
        <div class="home-distance-heading">
          <h2>Distance from campus</h2>
          <span id="home-distance-value">5 miles</span>
        </div>

        <div class="home-slider-container">
          <input
            type="range"
            id="home-distance-slider"
            min="1"
            max="15"
            value="5"
            step="1"
          />

          <div class="home-slider-labels">
            <span>1 mi</span>
            <span>3 mi</span>
            <span>5 mi</span>
            <span>10 mi</span>
            <span>15 mi</span>
          </div>
        </div>
      </section>

      <!-- Categories -->

      <div class="home-categories">
        <a href="explore.html" class="home-category active">
          <i data-lucide="laptop"></i>
          <span>Study</span>
        </a>

        <a href="explore.html" class="home-category">
          <i data-lucide="coffee"></i>
          <span>Food</span>
        </a>

        <a href="explore.html" class="home-category">
          <i data-lucide="calendar-days"></i>
          <span>Events</span>
        </a>

        <a href="explore.html" class="home-category">
          <i data-lucide="compass"></i>
          <span>Activities</span>
        </a>
      </div>

      <!-- Popular Now -->
      <section class="home-discovery-section">
        <div class="home-section-heading">
          <h2>Popular now</h2>
          <a href="explore.html">See all →</a>
        </div>

        <div class="home-card-carousel" id="popular-now">
          <p>Popular places coming soon!</p>
        </div>
      </section>

      <!-- Near Campus -->
      <section class="home-discovery-section">
        <div class="home-section-heading">
          <h2>Near your campus</h2>
          <a href="explore.html">See all →</a>
        </div>

        <div class="home-card-carousel" id="near-campus">
          <p>Nearby places coming soon!</p>
        </div>
      </section>
    </main>

    <!-- Shop Details Modal -->
    <div
      id="shop-modal"
      class="shop-modal hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Shop details"
    >
      <div class="shop-modal-content">
        <button
          id="close-modal"
          class="close-modal"
          type="button"
          aria-label="Close shop details"
        >
          &times;
        </button>

        <div id="modal-details"></div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="home-bottom-nav" aria-label="Main navigation">
      <a href="index.html" class="active" aria-current="page">
        <i data-lucide="house"></i>
        <span>Home</span>
      </a>

      <a href="explore.html">
        <i data-lucide="map"></i>
        <span>Explore</span>
      </a>

      <a href="saved.html">
        <i data-lucide="heart"></i>
        <span>Saved</span>
      </a>
    </nav>

    <!-- Supabase connection -->
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer
    ></script>
    <script src="supabase-client.js" defer></script>

    <!-- Shared shop details -->
    <script src="shop-details.js" defer></script>

    <!-- Home page -->
    <script src="home.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();
      });
    </script>
  </body>
</html>
