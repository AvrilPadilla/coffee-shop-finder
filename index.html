<!DOCTYPE html>
<html lang="en">

<head>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:wght@600&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <script>
    try {
      // Make sure the browser can actually save things before we rely on it
      localStorage.setItem("crunchTest", "1");
      localStorage.removeItem("crunchTest");

      if (localStorage.getItem("crunchSeenWelcome") !== "yes") {
        location.replace("welcome.html");
      }
    } catch (error) {
      // Storage is blocked (some private modes): skip the intro instead of looping
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Shop Finder</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

  <!-- The top of the page -->
  <header>
    <h1>Coffee Shop Finder</h1>
    <p>Find a cafe with the wifi, outlets, noise level, and seating you need to get work done.</p>
  </header>

  <main>
    <section id="filters">
      <h2>Filters</h2>

      <label class="check">
        <input type="checkbox" id="filter-wifi"> Wi-Fi required
      </label>

      <label>Outlets
        <select id="filter-outlets">
          <option value="any">Any</option>
          <option value="limited">Limited</option>
          <option value="some">Some</option>
          <option value="plenty">Plenty</option>
        </select>
      </label>

      <label>Noise
        <select id="filter-noise">
          <option value="any">Any</option>
          <option value="quiet">Quiet</option>
          <option value="moderate">Moderate</option>
          <option value="loud">Loud</option>
        </select>
      </label>

      <label>Seating
        <select id="filter-seating">
          <option value="any">Any</option>
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
        </select>
      </label>

      <label>Distance from campus
        <select id="filter-distance">
          <option value="any">Any distance</option>
          <option value="1">Within 1 mile</option>
          <option value="3">Within 3 miles</option>
          <option value="5">Within 5 miles</option>
          <option value="10">Within 10 miles</option>
          <option value="15">Within 15 miles</option>
        </select>
      </label>

    </section>

    <section id="explore-section">
      <h2>Explore near campus</h2>
      <p>Discover coffee shops and study spots around your school.</p>

      <!-- Switch between Map and List -->
      <div class="view-toggle">
        <button id="map-button" class="active" type="button">
          Map
        </button>

        <button id="list-button" type="button">
          List
        </button>
      </div>

      <!-- Map view -->
      <div id="map-view">
        <div id="map"></div>
      </div>

      <!-- List view -->
      <div id="list-view" class="hidden">
        <div id="shop-cards"></div>
      </div>
    </section>

  </main>

  <footer>
    <p>Built by Avril Padilla at Saddleback College</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js" defer></script>
</body>

</html>
